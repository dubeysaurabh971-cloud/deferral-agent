name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # The suite is offline: no API key, no vector store, no network. Verified by running it with
      # the HuggingFace Hub unreachable -- the one test that needs the Hub (the golden-set builder)
      # is marked `network` and skipped unless RUN_NETWORK_TESTS=1. It used to call
      # build_golden_set(), which hits load_dataset(), so the badge was green because runners have
      # internet rather than because the tests were self-contained. It covers the
      # decision policy, the clarification reviewer's guards, and the eval maths -- the parts that
      # must not drift silently.
      #
      # This is every module the test files import transitively, and no more:
      #   chromadb, rank_bm25  <- src.retrieval, imported by src.resolver
      #   datasets             <- src.golden, imported by tests/test_eval_harness.py
      #   pydantic, dotenv     <- src.gate, src.review, src.config
      # sentence-transformers (and therefore torch, 528MB) is deliberately absent: chromadb loads
      # it lazily when an embedding function is instantiated, which no test does. Installing
      # requirements.txt instead would add minutes for packages the tests never touch.
      - name: Install test dependencies
        run: pip install pytest chromadb rank_bm25 datasets pydantic python-dotenv

      - name: Run tests
        run: python -m pytest -q
